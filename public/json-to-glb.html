<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSON to GLB Converter</title>
    <script src="https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.158.0/examples/js/exporters/GLTFExporter.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #e2e8f0;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            color: #10B2E3;
            margin-bottom: 10px;
            font-size: 2.5em;
        }
        .subtitle {
            text-align: center;
            color: #94a3b8;
            margin-bottom: 40px;
        }
        .card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .upload-zone {
            border: 3px dashed #10B2E3;
            border-radius: 10px;
            padding: 60px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            background: rgba(16, 178, 227, 0.05);
        }
        .upload-zone:hover {
            background: rgba(16, 178, 227, 0.15);
            border-color: #22d3ee;
        }
        .upload-zone.dragover {
            background: rgba(16, 178, 227, 0.25);
            transform: scale(1.02);
        }
        .upload-icon {
            font-size: 4em;
            margin-bottom: 20px;
        }
        input[type="file"] {
            display: none;
        }
        .btn {
            background: linear-gradient(135deg, #10B2E3 0%, #0891b2 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            display: inline-block;
            margin: 10px;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(16, 178, 227, 0.3);
        }
        .btn:disabled {
            background: #475569;
            cursor: not-allowed;
            transform: none;
        }
        .preview-area {
            background: #0f172a;
            border-radius: 10px;
            padding: 20px;
            min-height: 400px;
            position: relative;
        }
        #canvas {
            width: 100%;
            height: 400px;
            border-radius: 10px;
        }
        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }
        .info-item {
            background: #0f172a;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }
        .info-label {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 5px;
        }
        .info-value {
            color: #10B2E3;
            font-size: 24px;
            font-weight: bold;
        }
        .status {
            padding: 10px 20px;
            border-radius: 8px;
            margin: 10px 0;
            text-align: center;
        }
        .status.success {
            background: rgba(34, 197, 94, 0.2);
            border: 1px solid #22c55e;
            color: #22c55e;
        }
        .status.error {
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid #ef4444;
            color: #ef4444;
        }
        .status.info {
            background: rgba(16, 178, 227, 0.2);
            border: 1px solid #10B2E3;
            color: #10B2E3;
        }
        .controls {
            text-align: center;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔄 JSON to GLB Converter</h1>
        <p class="subtitle">گۆڕینی فایلی UniRig JSON بۆ GLB format</p>

        <!-- Upload Section -->
        <div class="card">
            <div class="upload-zone" id="uploadZone">
                <div class="upload-icon">📁</div>
                <h2>فایلی JSON هەڵبژێرە</h2>
                <p style="color: #94a3b8; margin-top: 10px;">
                    کلیک بکە یان فایلەکە بخەرە ئێرە
                </p>
                <input type="file" id="fileInput" accept=".json">
            </div>
            <div id="statusMessage"></div>
        </div>

        <!-- Info Section -->
        <div class="card" id="infoSection" style="display: none;">
            <h3 style="color: #10B2E3; margin-bottom: 20px;">📊 زانیاری مۆدێل</h3>
            <div class="info-grid">
                <div class="info-item">
                    <div class="info-label">Vertices</div>
                    <div class="info-value" id="vertexCount">0</div>
                </div>
                <div class="info-item">
                    <div class="info-label">Joints</div>
                    <div class="info-value" id="jointCount">0</div>
                </div>
                <div class="info-item">
                    <div class="info-label">Bones</div>
                    <div class="info-value" id="boneCount">0</div>
                </div>
                <div class="info-item">
                    <div class="info-label">Confidence</div>
                    <div class="info-value" id="confidence">0%</div>
                </div>
            </div>
        </div>

        <!-- Preview Section -->
        <div class="card" id="previewSection" style="display: none;">
            <h3 style="color: #10B2E3; margin-bottom: 20px;">👁️ پێشبینین</h3>
            <div class="preview-area">
                <canvas id="canvas"></canvas>
            </div>
            <div class="controls">
                <button class="btn" id="downloadBtn" disabled>
                    ⬇️ دابەزاندنی GLB
                </button>
                <button class="btn" id="resetBtn">
                    🔄 دووبارە دەستپێبکەرەوە
                </button>
            </div>
        </div>
    </div>

    <script>
        let scene, camera, renderer, mesh, skeleton;
        let jsonData = null;

        // Upload zone handlers
        const uploadZone = document.getElementById('uploadZone');
        const fileInput = document.getElementById('fileInput');
        
        uploadZone.addEventListener('click', () => fileInput.click());
        
        uploadZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadZone.classList.add('dragover');
        });

        uploadZone.addEventListener('dragleave', () => {
            uploadZone.classList.remove('dragover');
        });

        uploadZone.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadZone.classList.remove('dragover');
            const file = e.dataTransfer.files[0];
            if (file) loadFile(file);
        });

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) loadFile(file);
        });

        function showStatus(message, type = 'info') {
            const statusDiv = document.getElementById('statusMessage');
            statusDiv.innerHTML = `<div class="status ${type}">${message}</div>`;
        }

        function loadFile(file) {
            showStatus('⏳ خوێندنەوەی فایل...', 'info');
            
            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    jsonData = JSON.parse(e.target.result);
                    processJSON(jsonData);
                    showStatus('✅ فایل بە سەرکەوتوویی خوێندرایەوە!', 'success');
                } catch (err) {
                    showStatus('❌ هەڵە: ' + err.message, 'error');
                }
            };
            reader.readAsText(file);
        }

        function processJSON(data) {
            // Show info
            document.getElementById('infoSection').style.display = 'block';
            document.getElementById('previewSection').style.display = 'block';
            
            const vertices = data.vertices || [];
            const joints = data.skeleton?.joints || [];
            const bones = data.skeleton?.bones || [];
            const confidence = data.skeleton?.confidence || 0;

            document.getElementById('vertexCount').textContent = vertices.length;
            document.getElementById('jointCount').textContent = joints.length;
            document.getElementById('boneCount').textContent = bones.length;
            document.getElementById('confidence').textContent = (confidence * 100).toFixed(1) + '%';

            // Create 3D scene
            create3DScene(data);
            
            // Enable download
            document.getElementById('downloadBtn').disabled = false;
        }

        function create3DScene(data) {
            const canvas = document.getElementById('canvas');
            
            // Setup scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0f172a);
            
            camera = new THREE.PerspectiveCamera(75, canvas.width / canvas.height, 0.1, 1000);
            camera.position.z = 5;
            
            renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
            renderer.setSize(canvas.width, canvas.height);
            
            // Add lights
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);
            
            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(5, 10, 5);
            scene.add(directionalLight);

            // Create skeleton visualization
            const joints = data.skeleton?.joints || [];
            const bones = data.skeleton?.bones || [];
            
            if (joints.length > 0) {
                // Draw joints as spheres
                joints.forEach((joint, i) => {
                    const geometry = new THREE.SphereGeometry(0.1, 16, 16);
                    const material = new THREE.MeshPhongMaterial({ 
                        color: 0x10B2E3,
                        emissive: 0x10B2E3,
                        emissiveIntensity: 0.3
                    });
                    const sphere = new THREE.Mesh(geometry, material);
                    sphere.position.set(joint[0], joint[1], joint[2]);
                    scene.add(sphere);
                });

                // Draw bones as lines
                bones.forEach(bone => {
                    const start = joints[bone[0]];
                    const end = joints[bone[1]];
                    if (start && end) {
                        const geometry = new THREE.BufferGeometry().setFromPoints([
                            new THREE.Vector3(start[0], start[1], start[2]),
                            new THREE.Vector3(end[0], end[1], end[2])
                        ]);
                        const material = new THREE.LineBasicMaterial({ color: 0x22d3ee });
                        const line = new THREE.Line(geometry, material);
                        scene.add(line);
                    }
                });
            }
            
            // Animation loop
            function animate() {
                requestAnimationFrame(animate);
                scene.rotation.y += 0.005;
                renderer.render(scene, camera);
            }
            animate();
        }

        // Download GLB
        document.getElementById('downloadBtn').addEventListener('click', () => {
            if (!jsonData) return;
            
            showStatus('⏳ دروستکردنی GLB...', 'info');
            
            const exporter = new THREE.GLTFExporter();
            exporter.parse(
                scene,
                (gltf) => {
                    const blob = new Blob([gltf], { type: 'model/gltf-binary' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = 'rigged_model.glb';
                    a.click();
                    URL.revokeObjectURL(url);
                    
                    showStatus('✅ GLB دابەزێندرا!', 'success');
                },
                { binary: true }
            );
        });

        // Reset
        document.getElementById('resetBtn').addEventListener('click', () => {
            location.reload();
        });
    </script>
</body>
</html>
