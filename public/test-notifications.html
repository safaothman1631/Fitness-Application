<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Notifications API</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: #1a1a1a;
            color: #fff;
        }
        .section {
            background: #2a2a2a;
            padding: 20px;
            margin: 20px 0;
            border-radius: 8px;
            border: 1px solid #3a3a3a;
        }
        button {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
        }
        button:hover {
            background: #2563eb;
        }
        .result {
            background: #1a1a1a;
            padding: 15px;
            margin-top: 10px;
            border-radius: 5px;
            border: 1px solid #3a3a3a;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        .success { color: #10b981; }
        .error { color: #ef4444; }
        h2 { color: #3b82f6; }
    </style>
</head>
<body>
    <h1>🔔 Test Notifications Database Connection</h1>
    
    <div class="section">
        <h2>1. Create Test Notification</h2>
        <p>User ID: <input type="text" id="userId" value="warning@darinfitness.com" style="width: 300px; padding: 5px;"></p>
        <button onclick="createNotification()">Create Notification</button>
        <div id="createResult" class="result" style="display:none;"></div>
    </div>

    <div class="section">
        <h2>2. Get All Notifications</h2>
        <button onclick="getNotifications()">Fetch Notifications</button>
        <div id="getResult" class="result" style="display:none;"></div>
    </div>

    <div class="section">
        <h2>3. Mark Notification as Read</h2>
        <p>Notification ID: <input type="text" id="notificationId" placeholder="Enter notification ID" style="width: 300px; padding: 5px;"></p>
        <button onclick="markAsRead()">Mark as Read</button>
        <div id="markResult" class="result" style="display:none;"></div>
    </div>

    <div class="section">
        <h2>4. Delete Notification</h2>
        <p>Notification ID: <input type="text" id="deleteId" placeholder="Enter notification ID" style="width: 300px; padding: 5px;"></p>
        <button onclick="deleteNotification()">Delete Notification</button>
        <div id="deleteResult" class="result" style="display:none;"></div>
    </div>

    <script>
        const BASE_URL = 'http://localhost:3001';

        async function createNotification() {
            const userId = document.getElementById('userId').value;
            const resultDiv = document.getElementById('createResult');
            resultDiv.style.display = 'block';
            resultDiv.innerHTML = '⏳ Creating notification...';

            try {
                const response = await fetch(`${BASE_URL}/api/notifications`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        userId: userId,
                        type: 'success',
                        title: 'Test Notification',
                        message: 'This is a test notification from the database! 🎉'
                    })
                });

                const data = await response.json();
                
                if (data.success) {
                    resultDiv.innerHTML = `<span class="success">✅ SUCCESS!</span>\n\n${JSON.stringify(data, null, 2)}`;
                } else {
                    resultDiv.innerHTML = `<span class="error">❌ ERROR:</span>\n\n${JSON.stringify(data, null, 2)}`;
                }
            } catch (error) {
                resultDiv.innerHTML = `<span class="error">❌ ERROR:</span>\n\n${error.message}`;
            }
        }

        async function getNotifications() {
            const userId = document.getElementById('userId').value;
            const resultDiv = document.getElementById('getResult');
            resultDiv.style.display = 'block';
            resultDiv.innerHTML = '⏳ Fetching notifications...';

            try {
                const response = await fetch(`${BASE_URL}/api/notifications?userId=${userId}`);
                const data = await response.json();
                
                if (data.notifications) {
                    resultDiv.innerHTML = `<span class="success">✅ Found ${data.notifications.length} notifications</span>\n\n${JSON.stringify(data, null, 2)}`;
                } else {
                    resultDiv.innerHTML = `<span class="error">❌ ERROR:</span>\n\n${JSON.stringify(data, null, 2)}`;
                }
            } catch (error) {
                resultDiv.innerHTML = `<span class="error">❌ ERROR:</span>\n\n${error.message}`;
            }
        }

        async function markAsRead() {
            const id = document.getElementById('notificationId').value;
            const resultDiv = document.getElementById('markResult');
            resultDiv.style.display = 'block';

            if (!id) {
                resultDiv.innerHTML = '<span class="error">⚠️ Please enter a notification ID</span>';
                return;
            }

            resultDiv.innerHTML = '⏳ Marking as read...';

            try {
                const response = await fetch(`${BASE_URL}/api/notifications/${id}`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ read: true })
                });

                const data = await response.json();
                
                if (data.success) {
                    resultDiv.innerHTML = `<span class="success">✅ SUCCESS!</span>\n\n${JSON.stringify(data, null, 2)}`;
                } else {
                    resultDiv.innerHTML = `<span class="error">❌ ERROR:</span>\n\n${JSON.stringify(data, null, 2)}`;
                }
            } catch (error) {
                resultDiv.innerHTML = `<span class="error">❌ ERROR:</span>\n\n${error.message}`;
            }
        }

        async function deleteNotification() {
            const id = document.getElementById('deleteId').value;
            const resultDiv = document.getElementById('deleteResult');
            resultDiv.style.display = 'block';

            if (!id) {
                resultDiv.innerHTML = '<span class="error">⚠️ Please enter a notification ID</span>';
                return;
            }

            resultDiv.innerHTML = '⏳ Deleting notification...';

            try {
                const response = await fetch(`${BASE_URL}/api/notifications/${id}`, {
                    method: 'DELETE'
                });

                const data = await response.json();
                
                if (data.success) {
                    resultDiv.innerHTML = `<span class="success">✅ SUCCESS!</span>\n\n${JSON.stringify(data, null, 2)}`;
                } else {
                    resultDiv.innerHTML = `<span class="error">❌ ERROR:</span>\n\n${JSON.stringify(data, null, 2)}`;
                }
            } catch (error) {
                resultDiv.innerHTML = `<span class="error">❌ ERROR:</span>\n\n${error.message}`;
            }
        }
    </script>
</body>
</html>
