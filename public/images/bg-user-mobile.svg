<!-- Normal User Login Background - Mobile Portrait (1080x2400)
     Palette: neutral deep blue
     Features: minimalist gradient, subtle radial glow, soft abstract blobs, clean center -->
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="2400" viewBox="0 0 1080 2400">
  <defs>
    <!-- Base gradient (navy) -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1020"/>
      <stop offset="100%" stop-color="#0E1430"/>
    </linearGradient>

    <!-- Corner glow -->
    <radialGradient id="cornerGlow" cx="85%" cy="14%" r="36%">
      <stop offset="0%" stop-color="#2A5DF7" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#2A5DF7" stop-opacity="0"/>
    </radialGradient>

    <!-- Center vignette -->
    <radialGradient id="vignette" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#0A0F1F" stop-opacity="0.70"/>
      <stop offset="50%" stop-color="#0A0F1F" stop-opacity="0.42"/>
      <stop offset="90%" stop-color="#0A0F1F" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0A0F1F" stop-opacity="0.00"/>
    </radialGradient>

    <!-- Blob gradient -->
    <linearGradient id="blob" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2F80ED"/>
      <stop offset="100%" stop-color="#56CCF2"/>
    </linearGradient>

    <!-- Film grain -->
    <filter id="film-grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.95" numOctaves="2" seed="7" stitchTiles="stitch" result="noise"/>
      <feColorMatrix type="saturate" values="0" in="noise" result="mono"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.028"/></feComponentTransfer>
    </filter>

    <!-- Scanlines -->
    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="4" height="1" fill="#FFFFFF" opacity="0.02"/>
    </pattern>

    <!-- Soft blur -->
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1080" height="2400" fill="url(#bg)"/>

  <!-- Corner glow -->
  <rect width="1080" height="2400" fill="url(#cornerGlow)"/>

  <!-- Abstract soft blobs (low opacity, off-center) -->
  <g opacity="0.16" filter="url(#soft)">
    <circle cx="200" cy="420" r="260" fill="url(#blob)"/>
    <circle cx="980" cy="1980" r="320" fill="url(#blob)"/>
    <circle cx="360" cy="2050" r="200" fill="url(#blob)"/>
  </g>

  <!-- Minimal thin lines -->
  <g opacity="0.15">
    <path d="M 140 240 L 560 280 L 980 260" stroke="#5DADE2" stroke-width="1" fill="none" stroke-linecap="round"/>
    <path d="M 120 2000 L 540 2040 L 980 2020" stroke="#7FB3D5" stroke-width="1" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Center vignette -->
  <rect width="1080" height="2400" fill="url(#vignette)"/>

  <!-- Scanlines and grain -->
  <rect width="1080" height="2400" fill="url(#scanlines)"/>
  <rect width="1080" height="2400" filter="url(#film-grain)" opacity="0.16"/>

  <!-- Optional safe area -->
  <!-- <rect x="120" y="540" width="840" height="1320" fill="none" stroke="#56CCF2" stroke-dasharray="10 12" opacity="0.2"/> -->
</svg>