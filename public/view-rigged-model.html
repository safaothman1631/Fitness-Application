<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UniRig Model Viewer</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 {
            color: #10B2E3;
            text-align: center;
        }
        .upload-area {
            border: 2px dashed #10B2E3;
            border-radius: 10px;
            padding: 40px;
            text-align: center;
            margin: 20px 0;
            cursor: pointer;
        }
        .upload-area:hover {
            background: rgba(16, 178, 227, 0.1);
        }
        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin: 20px 0;
        }
        .info-card {
            background: #1e293b;
            padding: 20px;
            border-radius: 10px;
            border: 1px solid #334155;
        }
        .info-card h3 {
            color: #10B2E3;
            margin-top: 0;
        }
        .json-viewer {
            background: #1e293b;
            padding: 20px;
            border-radius: 10px;
            overflow: auto;
            max-height: 400px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
        }
        .stat {
            font-size: 32px;
            font-weight: bold;
            color: #10B2E3;
        }
        .joint-list {
            max-height: 200px;
            overflow-y: auto;
            margin-top: 10px;
        }
        .joint-item {
            padding: 5px;
            margin: 2px 0;
            background: #0f172a;
            border-radius: 5px;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🤖 UniRig Model Viewer</h1>
        <p style="text-align: center; color: #94a3b8;">
            چاو لە فایلی JSON ـی Rigged Model بخشێنە
        </p>

        <div class="upload-area" id="uploadArea">
            <h2>📁 فایلی JSON هەڵبژێرە یان بیخەرە ئێرە</h2>
            <p>کلیک بکە یان فایلەکە drag & drop بکە</p>
            <input type="file" id="fileInput" accept=".json" style="display: none;">
        </div>

        <div id="results" style="display: none;">
            <div class="info-grid">
                <div class="info-card">
                    <h3>📊 زانیاری گشتی</h3>
                    <p>Format: <span id="format">-</span></p>
                    <p>Vertices: <span class="stat" id="vertexCount">0</span></p>
                    <p>Confidence: <span class="stat" id="confidence">0%</span></p>
                </div>

                <div class="info-card">
                    <h3>🦴 Skeleton</h3>
                    <p>Joints: <span class="stat" id="jointCount">0</span></p>
                    <p>Bones: <span class="stat" id="boneCount">0</span></p>
                </div>

                <div class="info-card">
                    <h3>🎨 Skinning</h3>
                    <p>Influences: <span class="stat" id="influences">0</span></p>
                    <p>Weights: <span id="weightsInfo">-</span></p>
                </div>
            </div>

            <div class="info-card">
                <h3>📝 Joints List</h3>
                <div class="joint-list" id="jointList"></div>
            </div>

            <div class="info-card">
                <h3>🔍 Raw JSON</h3>
                <div class="json-viewer" id="jsonViewer"></div>
            </div>
        </div>
    </div>

    <script>
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const results = document.getElementById('results');

        uploadArea.addEventListener('click', () => fileInput.click());
        
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.style.background = 'rgba(16, 178, 227, 0.2)';
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.style.background = '';
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.style.background = '';
            const file = e.dataTransfer.files[0];
            if (file) loadFile(file);
        });

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) loadFile(file);
        });

        function loadFile(file) {
            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const data = JSON.parse(e.target.result);
                    displayData(data);
                } catch (err) {
                    alert('هەڵە لە خوێندنەوەی فایل: ' + err.message);
                }
            };
            reader.readAsText(file);
        }

        function displayData(data) {
            results.style.display = 'block';

            // General info
            document.getElementById('format').textContent = data.format || 'N/A';
            document.getElementById('vertexCount').textContent = data.vertices?.length || 0;
            const confidence = data.skeleton?.confidence || 0;
            document.getElementById('confidence').textContent = (confidence * 100).toFixed(1) + '%';

            // Skeleton
            const joints = data.skeleton?.joints || [];
            const bones = data.skeleton?.bones || [];
            document.getElementById('jointCount').textContent = joints.length;
            document.getElementById('boneCount').textContent = bones.length;

            // Skinning
            const influences = data.skinning?.num_influences || 0;
            document.getElementById('influences').textContent = influences;
            const weightsCount = data.skinning?.weights?.length || 0;
            document.getElementById('weightsInfo').textContent = weightsCount + ' vertices';

            // Joint names
            const jointNames = data.skeleton?.joint_names || [];
            const jointList = document.getElementById('jointList');
            jointList.innerHTML = '';
            jointNames.forEach((name, i) => {
                const div = document.createElement('div');
                div.className = 'joint-item';
                const pos = joints[i];
                div.textContent = `${i}: ${name} - [${pos ? pos.join(', ') : 'N/A'}]`;
                jointList.appendChild(div);
            });

            // Raw JSON
            document.getElementById('jsonViewer').textContent = JSON.stringify(data, null, 2);
        }
    </script>
</body>
</html>
