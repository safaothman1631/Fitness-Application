<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Splash + Loading Demo - FitPro</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            background: #0E151B;
        }

        /* ============= STAGE 1: SPLASH SCREEN ============= */
        .splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background: linear-gradient(135deg, #0E151B 0%, #1a2631 50%, #0E151B 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10000;
            opacity: 1;
            transition: opacity 0.5s ease-out;
        }

        .splash-screen.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .logo-container {
            position: relative;
            animation: scaleIn 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes scaleIn {
            0% {
                transform: scale(0.5);
                opacity: 0;
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .logo-circle {
            width: 120px;
            height: 120px;
            background: linear-gradient(135deg, #10B2E3 0%, #73E8FF 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 60px rgba(16, 178, 227, 0.5);
            position: relative;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% {
                box-shadow: 0 0 60px rgba(16, 178, 227, 0.5);
            }
            50% {
                box-shadow: 0 0 80px rgba(16, 178, 227, 0.8);
            }
        }

        .logo-icon {
            font-size: 60px;
            color: white;
            font-weight: bold;
        }

        .app-name {
            margin-top: 30px;
            font-size: 42px;
            font-weight: 800;
            background: linear-gradient(90deg, #10B2E3 0%, #73E8FF 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: slideUp 0.8s ease-out 0.3s backwards;
        }

        @keyframes slideUp {
            0% {
                transform: translateY(20px);
                opacity: 0;
            }
            100% {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .tagline {
            margin-top: 10px;
            font-size: 16px;
            color: #73E8FF;
            animation: slideUp 0.8s ease-out 0.5s backwards;
        }

        .loading-dots {
            margin-top: 40px;
            display: flex;
            gap: 8px;
            animation: slideUp 0.8s ease-out 0.7s backwards;
        }

        .dot {
            width: 12px;
            height: 12px;
            background: linear-gradient(135deg, #10B2E3, #73E8FF);
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out;
        }

        .dot:nth-child(1) {
            animation-delay: -0.32s;
        }

        .dot:nth-child(2) {
            animation-delay: -0.16s;
        }

        @keyframes bounce {
            0%, 80%, 100% {
                transform: scale(0);
                opacity: 0.5;
            }
            40% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .ripple {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 120px;
            height: 120px;
            border: 2px solid #10B2E3;
            border-radius: 50%;
            animation: ripple 2s infinite;
        }

        .ripple:nth-child(2) {
            animation-delay: 0.5s;
        }

        .ripple:nth-child(3) {
            animation-delay: 1s;
        }

        @keyframes ripple {
            0% {
                width: 120px;
                height: 120px;
                opacity: 1;
            }
            100% {
                width: 200px;
                height: 200px;
                opacity: 0;
            }
        }

        /* ============= STAGE 2: LOADING SCREEN ============= */
        .loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background: #0E151B;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease-out;
        }

        .loading-screen.visible {
            opacity: 1;
            pointer-events: all;
        }

        .loading-screen.hidden {
            opacity: 0;
            pointer-events: none;
        }

        /* Skeleton Loading for User Profile */
        .skeleton-profile {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 40px;
        }

        .skeleton-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(90deg, #1a2631 0%, #2a3641 50%, #1a2631 100%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
        }

        @keyframes shimmer {
            0% {
                background-position: -200% 0;
            }
            100% {
                background-position: 200% 0;
            }
        }

        .skeleton-info {
            flex: 1;
        }

        .skeleton-name {
            width: 150px;
            height: 24px;
            background: linear-gradient(90deg, #1a2631 0%, #2a3641 50%, #1a2631 100%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            border-radius: 4px;
            margin-bottom: 10px;
        }

        .skeleton-email {
            width: 200px;
            height: 16px;
            background: linear-gradient(90deg, #1a2631 0%, #2a3641 50%, #1a2631 100%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            border-radius: 4px;
        }

        /* Progress Bar */
        .progress-container {
            width: 400px;
            margin-bottom: 30px;
        }

        .progress-label {
            color: #73E8FF;
            font-size: 14px;
            margin-bottom: 10px;
            text-align: center;
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: #1a2631;
            border-radius: 10px;
            overflow: hidden;
            position: relative;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #10B2E3 0%, #73E8FF 100%);
            border-radius: 10px;
            width: 0%;
            transition: width 0.3s ease-out;
            box-shadow: 0 0 10px rgba(16, 178, 227, 0.5);
        }

        /* Spinner */
        .spinner-container {
            margin-bottom: 30px;
        }

        .spinner {
            width: 60px;
            height: 60px;
            border: 4px solid #1a2631;
            border-top-color: #10B2E3;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* Loading Messages */
        .loading-message {
            color: #73E8FF;
            font-size: 16px;
            text-align: center;
            margin-top: 20px;
            min-height: 24px;
        }

        /* Skeleton Cards */
        .skeleton-cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-top: 40px;
        }

        .skeleton-card {
            width: 150px;
            height: 100px;
            background: linear-gradient(90deg, #1a2631 0%, #2a3641 50%, #1a2631 100%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            border-radius: 12px;
        }

        .skeleton-card:nth-child(2) {
            animation-delay: 0.1s;
        }

        .skeleton-card:nth-child(3) {
            animation-delay: 0.2s;
        }

        /* ============= STAGE 3: MAIN CONTENT ============= */
        .main-content {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background: #0E151B;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 24px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease-out;
        }

        .main-content.visible {
            opacity: 1;
            pointer-events: all;
        }

        .welcome-box {
            text-align: center;
            padding: 40px;
            background: rgba(16, 178, 227, 0.1);
            border-radius: 20px;
            border: 1px solid rgba(16, 178, 227, 0.3);
            animation: scaleIn 0.5s ease-out;
        }

        .welcome-box h1 {
            font-size: 32px;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #10B2E3 0%, #73E8FF 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .welcome-box p {
            color: #73E8FF;
            font-size: 16px;
        }

        .restart-btn {
            margin-top: 30px;
            padding: 15px 40px;
            background: linear-gradient(135deg, #10B2E3 0%, #73E8FF 100%);
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .restart-btn:hover {
            transform: scale(1.05);
        }

        .restart-btn:active {
            transform: scale(0.95);
        }

        .status-info {
            margin-top: 20px;
            font-size: 14px;
            color: #10B2E3;
        }
    </style>
</head>
<body>
    <!-- STAGE 1: Splash Screen -->
    <div class="splash-screen" id="splashScreen">
        <div class="ripple"></div>
        <div class="ripple"></div>
        <div class="ripple"></div>
        
        <div class="logo-container">
            <div class="logo-circle">
                <div class="logo-icon">💪</div>
            </div>
        </div>
        
        <h1 class="app-name">FitPro</h1>
        <p class="tagline">ڕاهێنەری تایبەتی تۆ</p>
        
        <div class="loading-dots">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>
    </div>

    <!-- STAGE 2: Loading Screen -->
    <div class="loading-screen" id="loadingScreen">
        <!-- User Profile Skeleton -->
        <div class="skeleton-profile">
            <div class="skeleton-avatar"></div>
            <div class="skeleton-info">
                <div class="skeleton-name"></div>
                <div class="skeleton-email"></div>
            </div>
        </div>

        <!-- Progress Bar -->
        <div class="progress-container">
            <div class="progress-label" id="progressLabel">دەستپێکردن...</div>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
        </div>

        <!-- Spinner -->
        <div class="spinner-container">
            <div class="spinner"></div>
        </div>

        <!-- Loading Message -->
        <div class="loading-message" id="loadingMessage">
            تکایە چاوەڕێ بە...
        </div>

        <!-- Skeleton Cards -->
        <div class="skeleton-cards">
            <div class="skeleton-card"></div>
            <div class="skeleton-card"></div>
            <div class="skeleton-card"></div>
        </div>
    </div>

    <!-- STAGE 3: Main Content -->
    <div class="main-content" id="mainContent">
        <div class="welcome-box">
            <h1>🎉 تەواو بوو!</h1>
            <p>هەردوو ستەیج بە سەرکەوتوویی تەواو بوون</p>
            <div class="status-info">
                ✅ Splash Screen (3 چرکە)<br>
                ✅ Loading Animations (5 چرکە)
            </div>
            <button class="restart-btn" onclick="restart()">
                🔄 دووبارە دەستپێبکەرەوە
            </button>
        </div>
    </div>

    <script>
        let currentStage = 1;
        let progressInterval;
        let messageInterval;
        
        const loadingMessages = [
            'بارکردنی زانیارییەکانی بەکارهێنەر...',
            'گرتنی ڕاهێنانەکان...',
            'ئامادەکردنی داشبۆرد...',
            'پشکنینی نوێکارییەکان...',
            'هاوکاتکردنی داتا...',
            'تەواوی کردن...'
        ];

        function updateProgress(percentage, message) {
            document.getElementById('progressFill').style.width = percentage + '%';
            document.getElementById('progressLabel').textContent = message;
        }

        function updateLoadingMessage(message) {
            document.getElementById('loadingMessage').textContent = message;
        }

        function startLoadingScreen() {
            console.log('🔄 Starting Loading Screen...');
            
            // Simulate progressive loading
            let progress = 0;
            let messageIndex = 0;
            
            progressInterval = setInterval(() => {
                progress += Math.random() * 15;
                if (progress > 100) progress = 100;
                
                updateProgress(progress, `${Math.round(progress)}% تەواو بوو`);
                
                if (progress >= 100) {
                    clearInterval(progressInterval);
                    setTimeout(showMainContent, 500);
                }
            }, 400);

            // Rotate loading messages
            messageInterval = setInterval(() => {
                updateLoadingMessage(loadingMessages[messageIndex]);
                messageIndex = (messageIndex + 1) % loadingMessages.length;
            }, 800);
        }

        function showMainContent() {
            console.log('✅ Showing Main Content');
            clearInterval(messageInterval);
            
            document.getElementById('loadingScreen').classList.remove('visible');
            document.getElementById('loadingScreen').classList.add('hidden');
            
            setTimeout(() => {
                document.getElementById('mainContent').classList.add('visible');
                currentStage = 3;
            }, 500);
        }

        function restart() {
            console.log('🔄 Restarting Demo...');
            clearInterval(progressInterval);
            clearInterval(messageInterval);
            
            // Reset all screens
            document.getElementById('splashScreen').classList.remove('hidden');
            document.getElementById('loadingScreen').classList.remove('visible', 'hidden');
            document.getElementById('mainContent').classList.remove('visible');
            
            // Reset progress
            document.getElementById('progressFill').style.width = '0%';
            document.getElementById('progressLabel').textContent = 'دەستپێکردن...';
            document.getElementById('loadingMessage').textContent = 'تکایە چاوەڕێ بە...';
            
            currentStage = 1;
            
            // Start sequence again
            setTimeout(init, 100);
        }

        function init() {
            console.log('🚀 Demo Started - Stage 1: Splash Screen');
            
            // Stage 1: Splash Screen (3 seconds)
            setTimeout(() => {
                console.log('➡️ Transitioning to Stage 2: Loading Screen');
                document.getElementById('splashScreen').classList.add('hidden');
                
                setTimeout(() => {
                    document.getElementById('loadingScreen').classList.add('visible');
                    currentStage = 2;
                    startLoadingScreen();
                }, 500);
            }, 3000);
        }

        // Start on page load
        init();
    </script>
</body>
</html>
