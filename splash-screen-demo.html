<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Splash Screen Demo - FitPro</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        /* Splash Screen */
        .splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background: linear-gradient(135deg, #0E151B 0%, #1a2631 50%, #0E151B 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            animation: fadeOut 0.5s ease-out 2.5s forwards;
        }

        @keyframes fadeOut {
            to {
                opacity: 0;
                visibility: hidden;
            }
        }

        /* Logo Container */
        .logo-container {
            position: relative;
            animation: scaleIn 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes scaleIn {
            0% {
                transform: scale(0.5);
                opacity: 0;
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        /* Logo Circle */
        .logo-circle {
            width: 120px;
            height: 120px;
            background: linear-gradient(135deg, #10B2E3 0%, #73E8FF 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 60px rgba(16, 178, 227, 0.5);
            position: relative;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% {
                box-shadow: 0 0 60px rgba(16, 178, 227, 0.5);
            }
            50% {
                box-shadow: 0 0 80px rgba(16, 178, 227, 0.8);
            }
        }

        /* Logo Icon */
        .logo-icon {
            font-size: 60px;
            color: white;
            font-weight: bold;
        }

        /* App Name */
        .app-name {
            margin-top: 30px;
            font-size: 42px;
            font-weight: 800;
            background: linear-gradient(90deg, #10B2E3 0%, #73E8FF 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: slideUp 0.8s ease-out 0.3s backwards;
        }

        @keyframes slideUp {
            0% {
                transform: translateY(20px);
                opacity: 0;
            }
            100% {
                transform: translateY(0);
                opacity: 1;
            }
        }

        /* Tagline */
        .tagline {
            margin-top: 10px;
            font-size: 16px;
            color: #73E8FF;
            animation: slideUp 0.8s ease-out 0.5s backwards;
        }

        /* Loading Dots */
        .loading-dots {
            margin-top: 40px;
            display: flex;
            gap: 8px;
            animation: slideUp 0.8s ease-out 0.7s backwards;
        }

        .dot {
            width: 12px;
            height: 12px;
            background: linear-gradient(135deg, #10B2E3, #73E8FF);
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out;
        }

        .dot:nth-child(1) {
            animation-delay: -0.32s;
        }

        .dot:nth-child(2) {
            animation-delay: -0.16s;
        }

        @keyframes bounce {
            0%, 80%, 100% {
                transform: scale(0);
                opacity: 0.5;
            }
            40% {
                transform: scale(1);
                opacity: 1;
            }
        }

        /* Ripple Effect */
        .ripple {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 120px;
            height: 120px;
            border: 2px solid #10B2E3;
            border-radius: 50%;
            animation: ripple 2s infinite;
        }

        .ripple:nth-child(2) {
            animation-delay: 0.5s;
        }

        .ripple:nth-child(3) {
            animation-delay: 1s;
        }

        @keyframes ripple {
            0% {
                width: 120px;
                height: 120px;
                opacity: 1;
            }
            100% {
                width: 200px;
                height: 200px;
                opacity: 0;
            }
        }

        /* Main Content (Hidden Initially) */
        .main-content {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background: #0E151B;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 24px;
            opacity: 0;
            animation: fadeIn 0.5s ease-out 3s forwards;
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
            }
        }

        .welcome-box {
            text-align: center;
            padding: 40px;
            background: rgba(16, 178, 227, 0.1);
            border-radius: 20px;
            border: 1px solid rgba(16, 178, 227, 0.3);
        }

        .welcome-box h1 {
            font-size: 32px;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #10B2E3 0%, #73E8FF 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .welcome-box p {
            color: #73E8FF;
            font-size: 16px;
        }

        /* Restart Button */
        .restart-btn {
            margin-top: 30px;
            padding: 15px 40px;
            background: linear-gradient(135deg, #10B2E3 0%, #73E8FF 100%);
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .restart-btn:hover {
            transform: scale(1.05);
        }

        .restart-btn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>
    <!-- Splash Screen -->
    <div class="splash-screen" id="splashScreen">
        <div class="ripple"></div>
        <div class="ripple"></div>
        <div class="ripple"></div>
        
        <div class="logo-container">
            <div class="logo-circle">
                <div class="logo-icon">💪</div>
            </div>
        </div>
        
        <h1 class="app-name">FitPro</h1>
        <p class="tagline">ڕاهێنەری تایبەتی تۆ</p>
        
        <div class="loading-dots">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <div class="welcome-box">
            <h1>🎉 بەخێربێیت بۆ FitPro!</h1>
            <p>Splash screen بە سەرکەوتوویی تەواو بوو</p>
            <button class="restart-btn" onclick="restartSplash()">
                🔄 دووبارە کردنەوە
            </button>
        </div>
    </div>

    <script>
        function restartSplash() {
            // Reset splash screen
            const splash = document.getElementById('splashScreen');
            splash.style.animation = 'none';
            splash.style.opacity = '1';
            splash.style.visibility = 'visible';
            
            // Force reflow
            void splash.offsetWidth;
            
            // Restart animation
            splash.style.animation = 'fadeOut 0.5s ease-out 2.5s forwards';
        }

        // Console log for demo
        console.log('🚀 Splash Screen Demo Started!');
        console.log('⏱️ Splash will disappear after 3 seconds');
        
        setTimeout(() => {
            console.log('✅ Splash Screen Complete!');
        }, 3000);
    </script>
</body>
</html>
