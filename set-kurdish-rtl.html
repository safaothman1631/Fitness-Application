<!DOCTYPE html>
<html dir="rtl" lang="ku">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>گۆڕینی زمان بۆ کوردی</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
            direction: rtl;
        }
        .container {
            background: rgba(255, 255, 255, 0.1);
            padding: 40px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            max-width: 500px;
        }
        button {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 18px;
            border-radius: 10px;
            cursor: pointer;
            margin: 10px;
            transition: all 0.3s;
        }
        button:hover {
            background: #45a049;
            transform: scale(1.05);
        }
        .success {
            background: #2196F3;
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
            display: none;
        }
        h1 {
            margin-bottom: 20px;
            font-size: 32px;
        }
        p {
            font-size: 18px;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌐 گۆڕینی زمان بۆ کوردی</h1>
        <p>کرتە بکە لەسەر دوگمەی خوارەوە بۆ گۆڕینی زمان بۆ کوردی و شوێنی بۆ لای ڕاست</p>
        
        <button onclick="setKurdishRTL()">✅ گۆڕین بۆ کوردی (RTL)</button>
        
        <div id="success" class="success">
            ✅ سەرکەوتوو بوو! زمان گۆڕدرا بۆ کوردی<br>
            دوای 2 چرکە پەڕەکە Refresh دەبێتەوە...
        </div>
        
        <p style="margin-top: 30px; font-size: 14px; opacity: 0.8;">
            ئەم فایلە بە دەستکردی localStorage دەستکاری دەکات و زمان دەگۆڕێت بۆ کوردی
        </p>
    </div>

    <script>
        function setKurdishRTL() {
            // Set language to Kurdish
            localStorage.setItem('language', 'ku');
            localStorage.setItem('app_language', 'ku');
            
            // Set direction to RTL
            document.documentElement.dir = 'rtl';
            document.documentElement.lang = 'ku';
            
            // Show success message
            document.getElementById('success').style.display = 'block';
            
            // Reload after 2 seconds to apply changes
            setTimeout(() => {
                window.location.href = 'http://localhost:3000';
            }, 2000);
        }
        
        // Check current settings on load
        window.onload = function() {
            const currentLang = localStorage.getItem('language');
            if (currentLang === 'ku') {
                document.getElementById('success').innerHTML = 
                    '✅ زمانەکە ئێستا کوردییە!<br>ئەگەر هێشتا لای چەپە، کلیک بکەرەوە بۆ Refresh کردن';
                document.getElementById('success').style.display = 'block';
            }
        };
    </script>
</body>
</html>
