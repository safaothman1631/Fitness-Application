<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Registration</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            background: #1a1a1a;
            color: #fff;
        }
        button {
            background: #10B2E3;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 8px;
            margin: 10px 0;
        }
        button:hover {
            background: #0B94C1;
        }
        #result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            white-space: pre-wrap;
            font-family: monospace;
        }
        .success {
            background: #1a3a1a;
            border: 1px solid #2a5a2a;
        }
        .error {
            background: #3a1a1a;
            border: 1px solid #5a2a2a;
        }
    </style>
</head>
<body>
    <h1>🧪 Test User Registration</h1>
    <p>Click the button to test registration API</p>
    
    <button onclick="testRegistration()">Test Registration</button>
    
    <div id="result"></div>

    <script>
        async function testRegistration() {
            const resultDiv = document.getElementById('result');
            resultDiv.textContent = '⏳ Testing registration...\n\n';
            
            try {
                const testData = {
                    email: `test${Date.now()}@example.com`,
                    name: "Test User",
                    firstName: "Test",
                    lastName: "User",
                    password: "test123456",
                    role: "user",
                    membership: "Free",
                    subscriptionStatus: "inactive",
                    subscriptionEndDate: null
                };

                console.log('📤 Sending:', testData);
                resultDiv.textContent += `📤 Sending data:\n${JSON.stringify(testData, null, 2)}\n\n`;

                const response = await fetch('/api/users', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(testData)
                });

                console.log('📡 Response:', response.status, response.statusText);
                resultDiv.textContent += `📡 Response: ${response.status} ${response.statusText}\n\n`;

                const contentType = response.headers.get("content-type");
                console.log('Content-Type:', contentType);
                resultDiv.textContent += `Content-Type: ${contentType}\n\n`;

                if (contentType && contentType.includes("application/json")) {
                    const data = await response.json();
                    console.log('📥 Response data:', data);
                    
                    if (response.ok) {
                        resultDiv.textContent += `✅ Success!\n\n${JSON.stringify(data, null, 2)}`;
                        resultDiv.className = 'success';
                    } else {
                        resultDiv.textContent += `❌ Error!\n\n${JSON.stringify(data, null, 2)}`;
                        resultDiv.className = 'error';
                    }
                } else {
                    const text = await response.text();
                    console.log('📥 Response text:', text);
                    resultDiv.textContent += `❌ Non-JSON Response:\n\n${text}`;
                    resultDiv.className = 'error';
                }

            } catch (error) {
                console.error('❌ Error:', error);
                resultDiv.textContent += `❌ Exception:\n\n${error.message}\n${error.stack}`;
                resultDiv.className = 'error';
            }
        }
    </script>
</body>
</html>
